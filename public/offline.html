<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d47a1" />
    <title>ExpertFee — آفلاین</title>
    <style>
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f5f9fd; color: #173b60; font-family: Tahoma, "Segoe UI", sans-serif; }
      main { width: min(100%, 520px); padding: 28px; border: 1px solid #d8e5f0; border-radius: 20px; background: #fff; text-align: center; box-shadow: 0 12px 32px rgba(47,102,152,.1); }
      h1 { margin: 0 0 8px; color: #0d47a1; font-size: 25px; }
      p { margin: 0; line-height: 2; }
      a { display: inline-grid; place-items: center; min-height: 44px; margin-top: 18px; border-radius: 12px; background: #1565c0; color: #fff; padding: 0 18px; font: inherit; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>اتصال اینترنت در دسترس نیست</h1>
      <p>اگر قبلاً برنامه را باز کرده باشید، با تلاش دوباره نسخه ذخیره‌شده اجرا می‌شود.</p>
      <a href="./">تلاش دوباره</a>
    </main>
  </body>
</html>
