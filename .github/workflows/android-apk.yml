name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Build installable APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Name APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ExpertFee-Android-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ExpertFee-Android-v1.0.0
          path: android/app/build/outputs/apk/debug/ExpertFee-Android-v1.0.0.apk
          if-no-files-found: error
      - name: Publish Android download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.0
          name: ExpertFee Android v1.0.0
          body: نسخه اندروید ExpertFee متصل به وب‌اپ رسمی تعرفه ۱۴۰۵
          files: android/app/build/outputs/apk/debug/ExpertFee-Android-v1.0.0.apk
          make_latest: true
