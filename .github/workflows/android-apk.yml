name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EXPERTFEE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/signing
          echo "$KEYSTORE_BASE64" | base64 --decode > android/signing/expertfee-release.jks
      - name: Build signed store APK and AAB
        env:
          EXPERTFEE_KEYSTORE_PATH: ../signing/expertfee-release.jks
          EXPERTFEE_STORE_PASSWORD: ${{ secrets.EXPERTFEE_STORE_PASSWORD }}
          EXPERTFEE_KEY_ALIAS: ${{ secrets.EXPERTFEE_KEY_ALIAS }}
          EXPERTFEE_KEY_PASSWORD: ${{ secrets.EXPERTFEE_KEY_PASSWORD }}
        run: gradle -p android assembleRelease bundleRelease --no-daemon
      - name: Name and verify store packages
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ExpertFee-Android-v1.0.1-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab ExpertFee-Android-v1.0.1-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs ExpertFee-Android-v1.0.1-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ExpertFee-Android-v1.0.1-store
          path: |
            ExpertFee-Android-v1.0.1-release.apk
            ExpertFee-Android-v1.0.1-release.aab
          if-no-files-found: error
      - name: Publish signed store release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-store-v1.0.1
          name: ExpertFee Android Store Release v1.0.1
          body: نسخه Release امضاشده برای انتشار در کافه‌بازار و مایکت — رفع تداخل دکمه‌های پایین صفحه با کلیدهای گوشی
          files: |
            ExpertFee-Android-v1.0.1-release.apk
            ExpertFee-Android-v1.0.1-release.aab
          make_latest: true
