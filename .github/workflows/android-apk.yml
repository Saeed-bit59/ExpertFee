name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build bundled web application
        run: npm ci && npm run build
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EXPERTFEE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/signing
          echo "$KEYSTORE_BASE64" | base64 --decode > android/signing/expertfee-release.jks
      - name: Build signed offline APK and AAB
        env:
          EXPERTFEE_KEYSTORE_PATH: ../signing/expertfee-release.jks
          EXPERTFEE_STORE_PASSWORD: ${{ secrets.EXPERTFEE_STORE_PASSWORD }}
          EXPERTFEE_KEY_ALIAS: ${{ secrets.EXPERTFEE_KEY_ALIAS }}
          EXPERTFEE_KEY_PASSWORD: ${{ secrets.EXPERTFEE_KEY_PASSWORD }}
        run: gradle -p android assembleRelease bundleRelease --no-daemon
      - name: Publish packages
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ExpertFee-Android-v1.0.2-offline.apk
          cp android/app/build/outputs/bundle/release/app-release.aab ExpertFee-Android-v1.0.2-offline.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs ExpertFee-Android-v1.0.2-offline.apk
          gh release delete android-offline-v1.0.2 --yes || true
          gh release create android-offline-v1.0.2 ExpertFee-Android-v1.0.2-offline.apk ExpertFee-Android-v1.0.2-offline.aab --title "ExpertFee Android Offline v1.0.2" --notes "اصلاح بازگشت گوشی و بزرگ‌تر شدن آیکون برنامه"
        env:
          GH_TOKEN: ${{ github.token }}
